services:
  - type: web
    name: expressu
    runtime: node
    plan: starter # persistent disks require a paid plan — Free won't work
    region: oregon
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    # Runs after build, before the new deploy takes traffic. Creates/updates the
    # SQLite schema on the persistent disk. Deliberately does NOT pass
    # --accept-data-loss: if a future schema change would drop data, this should
    # fail loudly and block the deploy rather than silently destroy anything.
    # Never run "npm run db:seed" here — the seed script creates fake accounts
    # and is dev-only.
    preDeployCommand: npx prisma db push --skip-generate
    # Backgrounds the moderation worker, keeps "next start" as the process Render
    # supervises for health checks and restarts. If the worker crashes it will NOT
    # auto-restart on its own — see README note on this in the deploy instructions.
    startCommand: sh -c "npm run worker & exec npm run start"
    healthCheckPath: /
    disk:
      name: expressu-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/app.db
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard — never commit this
